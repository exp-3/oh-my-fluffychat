name: Release Workflow

on:
  release:
    types:
      - created

concurrency:
  group: release_workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_web:
    if: github.event.release.tag_name == 'Release_Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - run: rm ./assets/vodozemac/.gitignore
      - name: Build Release Web
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --source-maps --base-href "/web/"
      - name: Create archive
        run: tar -czf fluffychat-web.tar.gz build/web/
      - name: Upload to release
        if: github.event.release.tag_name == 'Release_Build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" fluffychat-web.tar.gz --repo "${{ github.repository }}" --clobber
      - name: Clone fluffychat website
        if: github.event.release.tag_name == 'Release_Build'
        run: |
          git clone https://github.com/krille-chan/fluffychat-website.git
      - name: Build website
        if: github.event.release.tag_name == 'Release_Build'
        working-directory: fluffychat-website
        run: |
          npm ci
          npm run build
          mv out ../public
      - name: Copy FluffyChat web into it
        if: github.event.release.tag_name == 'Release_Build'
        run: |
          mkdir public/web
          cp -r build/web/* public/web/
          echo "fluffychat.im" >> public/CNAME
      - name: Deploy to GitHub Pages
        if: github.event.release.tag_name == 'Release_Build'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: fluffychat.im

  build_release_apks:
    name: Build release APK (${{ matrix.id }})
    if: github.event.release.tag_name == 'Release_Build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: armeabi-v7a
            target_platform: android-arm
            gradle_abi: armeabi-v7a
          - id: arm64-v8a
            target_platform: android-arm64
            gradle_abi: arm64-v8a
          - id: x86_64
            target_platform: android-x64
            gradle_abi: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/release.jks; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          if [[ ! -s android/release.jks ]]; then
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore." >&2
            exit 1
          fi

          if ! KEYSTORE_INFO="$(keytool \
            -J-Duser.language=en \
            -J-Duser.country=US \
            -list -v \
            -keystore android/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)"; then
            echo "Unable to open the Android keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD." >&2
            printf '%s\n' "$KEYSTORE_INFO" | tail -n 3 >&2
            exit 1
          fi
          KEY_ALIAS="$(printf '%s\n' "$KEYSTORE_INFO" | awk '
            /^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
            /^Entry type: (PrivateKeyEntry|SecretKeyEntry)$/ { print alias; exit }
          ' | head -n 1)"
          unset KEYSTORE_INFO
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "No key alias was found in the Android keystore." >&2
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../release.jks\n'
          } > android/key.properties
          chmod 600 android/release.jks android/key.properties
      - name: Build ${{ matrix.id }} release APK
        run: flutter build apk --release --target-platform ${{ matrix.target_platform }} --android-project-arg=fluffychatAndroidAbis=${{ matrix.gradle_abi }}
      - name: Save ${{ matrix.id }} release APK
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/fluffychat-android-${{ matrix.id }}.apk
      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "release-apks/fluffychat-android-${{ matrix.id }}.apk"
      - name: Attach ${{ matrix.id }} APK to release
        if: github.event.release.tag_name == 'Release_Build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "release-apks/fluffychat-android-${{ matrix.id }}.apk" --repo "${{ github.repository }}" --clobber
      - name: Remove Android signing files
        if: always()
        run: rm -f android/release.jks android/key.properties

  build_windows:
    if: github.event.release.tag_name == 'Release_Build'
    runs-on: windows-latest
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v7
      - name: Configure Flutter Pub cache
        shell: pwsh
        run: '"PUB_CACHE=$env:RUNNER_TEMP\pub-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Include Windows runtime files
        shell: pwsh
        run: |
          $bundle = "build\windows\x64\runner\Release"
          Copy-Item -Path "C:\Windows\System32\msvcp140.dll" -Destination $bundle
          Copy-Item -Path "C:\Windows\System32\vcruntime140.dll" -Destination $bundle
          Copy-Item -Path "C:\Windows\System32\vcruntime140_1.dll" -Destination $bundle
      - name: Create Windows release archive
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "fluffychat-windows.zip"
      - name: Attach Windows archive to release
        if: github.event.release.tag_name == 'Release_Build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" fluffychat-windows.zip --repo "${{ github.repository }}" --clobber
  build_linux:
    if: github.event.release.tag_name == 'Release_Build'
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest'}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install curl clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev cmake-data libsecret-1-dev libsecret-1-0 librhash0 libssl-dev libwebkit2gtk-4.1-dev -y
      - run: echo "FLUTTER_VERSION=$(yq '.environment.flutter' < .tool_versions.yaml)" >> $GITHUB_ENV
      - name: Install Flutter
        run: |
          git clone --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git
          ./flutter/bin/flutter doctor
      - uses: dtolnay/rust-toolchain@stable
      - run: ./flutter/bin/flutter pub get
      - run: ./flutter/bin/flutter build linux --target-platform linux-${{ matrix.arch }}
      - name: Create archive
        run: tar -czf fluffychat-linux-${{ matrix.arch }}.tar.gz -C build/linux/${{ matrix.arch }}/release/bundle/ .
      - name: Upload to release
        if: github.event.release.tag_name == 'Release_Build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "fluffychat-linux-${{ matrix.arch }}.tar.gz" --repo "${{ github.repository }}" --clobber
