name: Release Workflow

on:
  release:
    types:
      - created

concurrency:
  group: release_workflow
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - run: rm ./assets/vodozemac/.gitignore
      - name: Build Release Web
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --source-maps --base-href "/web/"
      - name: Create archive
        run: tar -czf fluffychat-web.tar.gz build/web/
      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: Web Build
          path: fluffychat-web.tar.gz
      - name: Upload to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: fluffychat-web.tar.gz
          asset_name: fluffychat-web.tar.gz
          asset_content_type: application/gzip
      - name: Clone fluffychat website
        run: |
          git clone https://github.com/krille-chan/fluffychat-website.git
      - name: Build website
        working-directory: fluffychat-website
        run: |
          npm ci
          npm run build
          mv out ../public
      - name: Copy FluffyChat web into it
        run: |
          mkdir public/web
          mkdir public/nightly
          cp -r build/web/* public/web/
          cp -r build/web/* public/nightly/
          echo "fluffychat.im" >> public/CNAME
      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: fluffychat.im

  build_release_apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: armeabi-v7a
            target_platform: android-arm
            gradle_abi: armeabi-v7a
          - id: arm64-v8a
            target_platform: android-arm64
            gradle_abi: arm64-v8a
          - id: x86_64
            target_platform: android-x64
            gradle_abi: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          KEYSTORE_INFO="$(keytool -list -v -J-Duser.language=en -J-Duser.country=US \
            -keystore android/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null)"
          KEY_ALIAS="$(printf '%s\n' "$KEYSTORE_INFO" | awk '
            /^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
            /^Entry type: (PrivateKeyEntry|SecretKeyEntry)$/ { print alias; exit }
          ' | head -n 1)"
          unset KEYSTORE_INFO
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "No key alias was found in the Android keystore." >&2
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../release.jks\n'
          } > android/key.properties
          chmod 600 android/release.jks android/key.properties
      - name: Build ${{ matrix.id }} release APK
        run: flutter build apk --release --target-platform ${{ matrix.target_platform }} --android-project-arg=fluffychatAndroidAbis=${{ matrix.gradle_abi }}
      - name: Save ${{ matrix.id }} release APK
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/fluffychat-android-${{ matrix.id }}.apk
      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "release-apks/fluffychat-android-${{ matrix.id }}.apk"
      - name: Upload ${{ matrix.id }} release APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ matrix.id }}
          path: release-apks/fluffychat-android-${{ matrix.id }}.apk
      - name: Attach ${{ matrix.id }} APK to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release-apks/fluffychat-android-${{ matrix.id }}.apk
          asset_name: fluffychat-android-${{ matrix.id }}.apk
          asset_content_type: application/vnd.android.package-archive
      - name: Remove Android signing files
        if: always()
        run: rm -f android/release.jks android/key.properties

  build_linux:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest'}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install curl clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev cmake-data libsecret-1-dev libsecret-1-0 librhash0 libssl-dev libwebkit2gtk-4.1-dev -y
      - run: echo "FLUTTER_VERSION=$(yq '.environment.flutter' < .tool_versions.yaml)" >> $GITHUB_ENV
      - name: Install Flutter
        run: |
          git clone --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git
          ./flutter/bin/flutter doctor
      - uses: dtolnay/rust-toolchain@stable
      - run: ./flutter/bin/flutter pub get
      - run: ./flutter/bin/flutter build linux --target-platform linux-${{ matrix.arch }}
      - name: Create archive
        run: tar -czf fluffychat-linux-${{ matrix.arch }}.tar.gz -C build/linux/${{ matrix.arch }}/release/bundle/ .
      - name: Upload to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: fluffychat-linux-${{ matrix.arch }}.tar.gz
          asset_name: fluffychat-linux-${{ matrix.arch }}.tar.gz
          asset_content_type: application/gzip

  deploy_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
