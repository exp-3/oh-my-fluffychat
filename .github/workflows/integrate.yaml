name: Code Checks

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  repository_checks:
    name: Repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: webiny/action-conventional-commits@v1.4.2
      - name: Check licenses
        uses: fsfe/reuse-action@v6
      - run: ./scripts/generate-locale-config.sh
      - run: git diff --exit-code
      - name: Check for empty translations
        run: |
          if grep -rn '": ""' lib/l10n/*.arb; then
            echo "❌ Found empty translation strings."
            exit 1
          fi

  prepare_checks:
    name: Prepare dependencies and Dart repairs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dependency_lock_repaired: ${{ steps.flutter_dependencies.outputs.lock_repaired }}
      dart_sources_repaired: ${{ steps.dart_repairs.outputs.repaired }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Flutter dependencies
        id: flutter_dependencies
        shell: bash
        run: |
          set -euo pipefail
          pub_get_log="$(mktemp)"

          if flutter pub get 2>&1 | tee "$pub_get_log"; then
            rm -f "$pub_get_log"
            echo "lock_repaired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eq 'Could not find a file named "pubspec\.yaml" in .* [[:xdigit:]]{40}\.' "$pub_get_log"; then
            rm -f "$pub_get_log"
            exit 1
          fi
          rm -f "$pub_get_log"

          mapfile -t git_dependencies < <(
            awk '
              /^  [a-z0-9_]+:$/ {
                package_name = $1
                sub(/:$/, "", package_name)
              }
              /^    source: git$/ { print package_name }
            ' pubspec.lock
          )

          if (( ${#git_dependencies[@]} == 0 )); then
            echo "The failed Git dependency could not be identified in pubspec.lock." >&2
            exit 1
          fi

          echo "A locked Git revision is unavailable; refreshing: ${git_dependencies[*]}"
          flutter pub upgrade "${git_dependencies[@]}"
          echo "lock_repaired=true" >> "$GITHUB_OUTPUT"
      - name: Check if pubspec.lock is up to date
        shell: bash
        run: |
          if [[ "${{ steps.flutter_dependencies.outputs.lock_repaired }}" == "true" ]]; then
            echo "::warning::pubspec.lock was repaired after a locked Git revision became unavailable."
            git diff -- pubspec.lock
          else
            git diff --exit-code pubspec.lock
          fi
      - name: Store repaired dependency lock
        if: >-
          always() &&
          steps.flutter_dependencies.outputs.lock_repaired == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: repaired-dependency-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
      - name: Apply Dart fixes
        id: dart_fix
        shell: bash
        run: |
          set -euo pipefail
          fix_status=0
          dart fix --apply lib/ || fix_status=$?
          dart fix --apply test/ || fix_status=$?
          exit "$fix_status"
      - name: Apply Dart formatting
        if: ${{ !cancelled() && steps.dart_fix.outcome != 'skipped' }}
        shell: bash
        run: dart format lib/ test/
      - name: Capture Dart repairs
        id: dart_repairs
        if: ${{ always() && steps.dart_fix.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- lib/ test/; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Dart fixes and formatting were applied automatically."
          git diff --binary -- lib/ test/ > "$RUNNER_TEMP/dart-repairs.patch"
          git diff --stat -- lib/ test/
          echo "repaired=true" >> "$GITHUB_OUTPUT"
      - name: Store Dart repairs
        if: >-
          always() &&
          steps.dart_repairs.outputs.repaired == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: repaired-dart-sources
          path: ${{ runner.temp }}/dart-repairs.patch
          if-no-files-found: error
          retention-days: 1

  analysis_checks:
    name: Analysis and dependency checks
    needs: prepare_checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/restore_code_checks
        with:
          dependency-lock-repaired: ${{ needs.prepare_checks.outputs.dependency_lock_repaired }}
          dart-sources-repaired: ${{ needs.prepare_checks.outputs.dart_sources_repaired }}
      - name: Check license compliance
        run: dart run license_checker check-licenses -c licenses.yaml --problematic
      - name: Check for unused translations
        run: |
          dart pub global activate sweeper
          dart pub global run sweeper check
      - run: flutter analyze
      - name: Search unused dependencies
        run: |
          dart pub global activate dependency_validator
          dart pub global run dependency_validator
      - name: Check for commented-out Dart code with semicolons
        run: |
          if grep -R --include="*.dart" -nE '^[[:space:]]*//[^/<].*;[[:space:]]*$' lib/; then
            echo ""
            echo "❌ Found commented-out Dart code ending with semicolon."
            exit 1
          fi

  code_metrics:
    name: Dart code analysis
    needs: prepare_checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/restore_code_checks
        with:
          dependency-lock-repaired: ${{ needs.prepare_checks.outputs.dependency_lock_repaired }}
          dart-sources-repaired: ${{ needs.prepare_checks.outputs.dart_sources_repaired }}
      - run: dart run dart_code_linter:metrics analyze lib --reporter=github

  unused_code_checks:
    name: Unused checks (${{ matrix.check }})
    needs: prepare_checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [code, files, l10n]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/restore_code_checks
        with:
          dependency-lock-repaired: ${{ needs.prepare_checks.outputs.dependency_lock_repaired }}
          dart-sources-repaired: ${{ needs.prepare_checks.outputs.dart_sources_repaired }}
      - run: dart run dart_code_linter:metrics check-unused-${{ matrix.check }} lib

  tests:
    name: Tests (shard ${{ matrix.shard }})
    needs: prepare_checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check Firebase configuration
        id: firebase
        uses: ./.github/actions/prepare_firebase
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - uses: ./.github/actions/restore_code_checks
        with:
          dependency-lock-repaired: ${{ needs.prepare_checks.outputs.dependency_lock_repaired }}
          dart-sources-repaired: ${{ needs.prepare_checks.outputs.dart_sources_repaired }}
      - name: Add Firebase Messaging
        if: steps.firebase.outputs.configured == 'true'
        run: ./scripts/add-firebase-messaging.sh
      - name: Analyze with Firebase Messaging
        if: steps.firebase.outputs.configured == 'true' && matrix.shard == 0
        run: flutter analyze
      - name: Prepare test encryption library
        run: ./scripts/prepare_vodozemac.sh
      - name: Run test shard
        id: flutter_tests
        run: >-
          flutter test --total-shards=3 --shard-index=${{ matrix.shard }}
          --file-reporter=json:${{ runner.temp }}/test-results.json
      - name: Upload test timing report
        if: ${{ !cancelled() && steps.flutter_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results.json
          if-no-files-found: warn
          retention-days: 7

  code_tests:
    needs:
      - repository_checks
      - prepare_checks
      - analysis_checks
      - code_metrics
      - unused_code_checks
      - tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required job results
        shell: bash
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$CHECK_RESULTS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$CHECK_RESULTS" > /dev/null; then
            echo "::error::One or more required checks failed, were cancelled, or were skipped."
            exit 1
          fi

  commit_automatic_repairs:
    name: Commit automatic repairs
    needs: [prepare_checks, code_tests]
    if: >-
      always() &&
      (needs.prepare_checks.outputs.dependency_lock_repaired == 'true' ||
      needs.prepare_checks.outputs.dart_sources_repaired == 'true') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download repaired dependency lock
        if: needs.prepare_checks.outputs.dependency_lock_repaired == 'true'
        uses: actions/download-artifact@v7
        with:
          name: repaired-dependency-lock
          path: ${{ runner.temp }}/repaired-dependency-lock
      - name: Download repaired Dart sources
        if: needs.prepare_checks.outputs.dart_sources_repaired == 'true'
        uses: actions/download-artifact@v7
        with:
          name: repaired-dart-sources
          path: ${{ runner.temp }}/repaired-dart-sources
      - name: Apply and commit repairs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.prepare_checks.outputs.dependency_lock_repaired }}" == "true" ]]; then
            cp "$RUNNER_TEMP/repaired-dependency-lock/pubspec.lock" pubspec.lock
          fi

          if [[ "${{ needs.prepare_checks.outputs.dart_sources_repaired }}" == "true" ]]; then
            git apply "$RUNNER_TEMP/repaired-dart-sources/dart-repairs.patch"
          fi

          if git diff --quiet -- pubspec.lock lib/ test/; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib/ test/

          if [[ "${{ needs.prepare_checks.outputs.dependency_lock_repaired }}" == "true" &&
                "${{ needs.prepare_checks.outputs.dart_sources_repaired }}" == "true" ]]; then
            commit_message="chore: apply automatic CI repairs"
          elif [[ "${{ needs.prepare_checks.outputs.dart_sources_repaired }}" == "true" ]]; then
            commit_message="fix: apply automatic Dart fixes and formatting"
          else
            commit_message="fix(deps): refresh unavailable Git revisions"
          fi

          git commit -m "$commit_message"
          git push origin HEAD:main
